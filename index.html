<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">

<title>SuhbatAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#07070d;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:18px 15px 30px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:linear-gradient(135deg,#9b6cff,#4f46e5);
    font-size:23px;
    box-shadow:0 8px 25px rgba(124,58,237,.3);
}

.brand h1{
    font-size:20px;
}

.brand h1 span{
    color:#a78bfa;
}

.brand p{
    color:#77778b;
    font-size:9px;
    margin-top:3px;
}

/* HOME */

.home{
    padding-top:38px;
}

.online{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border:1px solid #302b46;
    border-radius:30px;
    background:#11101d;
    color:#a78bfa;
    font-size:9px;
    font-weight:bold;
}

.online i{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#55df9b;
    box-shadow:0 0 9px #55df9b;
}

.hero{
    margin-top:17px;
}

.hero h2{
    font-size:32px;
    line-height:1.13;
    letter-spacing:-1px;
}

.hero h2 span{
    color:#858597;
}

.hero p{
    margin-top:14px;
    color:#77778b;
    font-size:12px;
    line-height:1.6;
}

/* LIMIT */

.limit{
    margin-top:25px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid #242438;
    border-radius:19px;
    background:#0f0f19;
}

.limit-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.limit-icon{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:#18142b;
}

.limit strong{
    display:block;
    font-size:12px;
}

.limit small{
    display:block;
    margin-top:3px;
    color:#66667a;
    font-size:9px;
}

.limit-number{
    color:#a78bfa;
    font-size:18px;
    font-weight:bold;
}

.limit-number span{
    color:#5e5e70;
    font-size:10px;
}

/* SERVICES */

.section-title{
    margin:28px 2px 13px;
    font-size:14px;
    font-weight:bold;
}

.services{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.service{
    height:165px;
    padding:15px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    border-radius:21px;
    color:#fff;
    text-align:left;
    transition:.15s;
}

.service:active{
    transform:scale(.97);
}

.friend{
    background:linear-gradient(145deg,#38217c,#121020);
}

.laugh{
    background:linear-gradient(145deg,#762650,#1b101c);
}

.advice{
    background:linear-gradient(145deg,#176676,#0d191f);
}

.question{
    background:linear-gradient(145deg,#167051,#0d1917);
}

.service-icon{
    font-size:27px;
}

.service h3{
    position:absolute;
    left:15px;
    bottom:34px;
    font-size:16px;
}

.service p{
    position:absolute;
    left:15px;
    bottom:17px;
    color:rgba(255,255,255,.55);
    font-size:9px;
}

/* CHAT */

.chat{
    display:none;
    height:calc(100vh - 36px);
    flex-direction:column;
}

.chat.active{
    display:flex;
}

.chat-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0 13px;
    border-bottom:1px solid #252538;
}

.back{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#151522;
    color:#fff;
    font-size:20px;
}

.chat-avatar{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    font-size:20px;
}

.chat-info h3{
    font-size:14px;
}

.chat-info p{
    margin-top:3px;
    color:#6e6e82;
    font-size:9px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 2px;
}

.message{
    max-width:86%;
    margin-bottom:11px;
    padding:12px 14px;
    border-radius:16px;
    font-size:12px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
}

.bot{
    background:#151522;
    border:1px solid #262638;
    color:#ddddea;
    border-top-left-radius:5px;
}

.user{
    margin-left:auto;
    background:linear-gradient(135deg,#7952df,#5554d9);
    border-top-right-radius:5px;
}

.typing{
    color:#858597;
    font-style:italic;
}

.input-area{
    display:flex;
    gap:8px;
    padding-top:8px;
}

.input-area input{
    flex:1;
    min-width:0;
    height:50px;
    padding:0 15px;
    outline:none;
    border:1px solid #29293b;
    border-radius:15px;
    background:#11111c;
    color:#fff;
    font-size:12px;
}

.input-area input:focus{
    border-color:#7658c9;
}

.send{
    width:50px;
    height:50px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:#fff;
    font-size:20px;
}

.home-button{
    width:100%;
    height:43px;
    margin-top:9px;
    border:1px solid #29293b;
    border-radius:13px;
    background:#151522;
    color:#aaaabd;
    font-size:11px;
}

/* ERROR */

.error{
    background:#2a1519;
    border:1px solid #633039;
    color:#ffb5bc;
}

/* LOADING */

.loading{
    display:none;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:8px;
    color:#77778b;
    font-size:9px;
}

.loading.show{
    display:flex;
}

.dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#a78bfa;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.25;
    }
    50%{
        opacity:1;
    }
}

@media(max-width:370px){

    .hero h2{
        font-size:28px;
    }

    .service{
        height:150px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">

<div class="logo">✦</div>

<div>
<h1>Suhbat<span>AI</span></h1>
<p>Sizning aqlli suhbatdoshingiz</p>
</div>

</div>

</header>


<!-- HOME -->

<section id="home" class="home">

<div class="online">
<i></i>
AI ONLINE
</div>

<div class="hero">

<h2>
Salom! 👋<br>
<span>Bugun nima haqida</span><br>
gaplashamiz?
</h2>

<p>
Suhbatlashing, savol bering, maslahat oling
yoki shunchaki suhbat qiling.
</p>

</div>


<div class="limit">

<div class="limit-left">

<div class="limit-icon">⚡</div>

<div>
<strong>Bepul foydalanish</strong>
<small>Bugungi savollar</small>
</div>

</div>

<div class="limit-number">
<span id="used">0</span> / 5
</div>

</div>


<div class="section-title">
✨ Suhbat turini tanlang
</div>


<div class="services">

<button
class="service friend"
onclick="openChat('Do‘st','🧑‍🤝‍🧑')">

<div class="service-icon">🧑‍🤝‍🧑</div>

<h3>Do‘st</h3>

<p>Bemalol suhbatlashing</p>

</button>


<button
class="service laugh"
onclick="openChat('Kulgu','😂')">

<div class="service-icon">😂</div>

<h3>Kulgu</h3>

<p>Hazil va qiziqarli suhbat</p>

</button>


<button
class="service advice"
onclick="openChat('Maslahatchi','💡')">

<div class="service-icon">💡</div>

<h3>Maslahatchi</h3>

<p>Foydali maslahat oling</p>

</button>


<button
class="service question"
onclick="openChat('Savol-javob','❓')">

<div class="service-icon">❓</div>

<h3>Savol-javob</h3>

<p>Istalgan savolingizni bering</p>

</button>

</div>

</section>


<!-- CHAT -->

<section id="chat" class="chat">

<div class="chat-header">

<button
class="back"
onclick="goHome()">
←
</button>

<div
class="chat-avatar"
id="chatAvatar">
🤖
</div>

<div class="chat-info">

<h3 id="chatName">
Do‘st
</h3>

<p>
SuhbatAI • Online
</p>

</div>

</div>


<div
class="messages"
id="messages">
</div>


<div
class="loading"
id="loading">

<div class="dot"></div>
AI javob tayyorlamoqda...

</div>


<div class="input-area">

<input
id="input"
type="text"
placeholder="Xabar yozing..."
autocomplete="off"
>

<button
class="send"
id="sendButton"
onclick="sendMessage()">
➤
</button>

</div>


<button
class="home-button"
onclick="goHome()">
← Bosh sahifaga qaytish
</button>

</section>

</div>


<script>

/*
========================================
SUHBATAI BACKEND
========================================
*/

const API_URL =
"https://suhbatai-backend-1.onrender.com/chat";


let currentChat = "Do‘st";

let usedQuestions = 0;


/*
========================================
CHAT OCHISH
========================================
*/

function openChat(name, emoji){

    currentChat = name;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("chat")
        .classList.add("active");

    document.getElementById("chatName")
        .textContent = name;

    document.getElementById("chatAvatar")
        .textContent = emoji;

    document.getElementById("messages")
        .innerHTML = "";

    addBot(
        "😊 Salom! Men SuhbatAI.\n\n" +
        "Sizga qanday yordam bera olaman?"
    );

    document.getElementById("input")
        .focus();
}


/*
========================================
BOSH SAHIFA
========================================
*/

function goHome(){

    document.getElementById("chat")
        .classList.remove("active");

    document.getElementById("home")
        .style.display = "block";
}


/*
========================================
USER XABARI
========================================
*/

function addUser(text){

    const box =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message user";

    message.textContent = text;

    box.appendChild(message);

    scrollBottom();
}


/*
========================================
AI XABARI
========================================
*/

function addBot(text){

    const box =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message bot";

    message.textContent = text;

    box.appendChild(message);

    scrollBottom();
}


/*
========================================
XATO XABARI
========================================
*/

function addError(text){

    const box =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message error";

    message.textContent = text;

    box.appendChild(message);

    scrollBottom();
}


/*
========================================
LOADING
========================================
*/

function showLoading(){

    document.getElementById("loading")
        .classList.add("show");

    document.getElementById("sendButton")
        .disabled = true;
}


function hideLoading(){

    document.getElementById("loading")
        .classList.remove("show");

    document.getElementById("sendButton")
        .disabled = false;
}


/*
========================================
PASTGA TUSHIRISH
========================================
*/

function scrollBottom(){

    const box =
        document.getElementById("messages");

    box.scrollTop =
        box.scrollHeight;
}


/*
========================================
AI GA XABAR YUBORISH
========================================
*/

async function sendMessage(){

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();


    if(!text){
        return;
    }


    /*
    5 TA BEPUL SAVOL
    */

    if(usedQuestions >= 5){

        addBot(
            "⭐ Bugungi bepul savollar limiti tugadi."
        );

        return;
    }


    addUser(text);

    input.value = "";

    usedQuestions++;

    document.getElementById("used")
        .textContent = usedQuestions;

    showLoading();


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        message:text
                    })
                }
            );


        /*
        SERVER JAVOBINI OLISH
        */

        const data =
            await response.json();


        hideLoading();


        /*
        SERVER XATOSI
        */

        if(!response.ok){

            console.error(
                "Server xatosi:",
                data
            );

            addError(
                data.error ||
                "Server xatolik qaytardi."
            );

            return;
        }


        /*
        AI JAVOBI
        */

        if(data.answer){

            addBot(data.answer);

        }else{

            addError(
                "AI javob qaytarmadi."
            );
        }


    }catch(error){

        hideLoading();

        console.error(
            "Ulanish xatosi:",
            error
        );


        addError(
            "❌ Server bilan bog‘lanib bo‘lmadi.\n\n" +
            "Render serveri yoki internet ulanishini tekshiring."
        );
    }

}


/*
========================================
ENTER BOSILGANDA YUBORISH
========================================
*/

document.getElementById("input")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();
        }

    }
);


/*
========================================
START
========================================
*/

console.log(
    "SuhbatAI frontend ishga tushdi"
);

console.log(
    "Backend:",
    API_URL
);

</script>

</body>
  </html>
