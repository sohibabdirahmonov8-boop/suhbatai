<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080812">

<title>SuhbatAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#07070f;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:18px 15px 105px;
    position:relative;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:47px;
    height:47px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#9b6cff,#4f46e5);
    font-size:24px;
}

.brand h1{
    font-size:20px;
}

.brand h1 span{
    color:#a78bfa;
}

.brand p{
    color:#6d6d80;
    font-size:9px;
    margin-top:3px;
}

.status{
    margin-top:35px;
    display:inline-block;
    padding:7px 12px;
    border-radius:30px;
    background:#151326;
    color:#a78bfa;
    font-size:10px;
}

.hero{
    margin-top:15px;
}

.hero h2{
    font-size:31px;
    line-height:1.15;
}

.hero h2 span{
    color:#9292a6;
}

.hero p{
    margin-top:13px;
    color:#77778b;
    font-size:12px;
    line-height:1.6;
}

.services{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:30px;
}

.service{
    height:155px;
    padding:15px;
    border-radius:22px;
    border:1px solid #29283b;
    color:#fff;
    text-align:left;
}

.friend{
    background:linear-gradient(135deg,#33206e,#121021);
}

.laugh{
    background:linear-gradient(135deg,#682348,#1a101b);
}

.advice{
    background:linear-gradient(135deg,#145c68,#0e1a20);
}

.question{
    background:linear-gradient(135deg,#146b51,#0d1917);
}

.serviceIcon{
    font-size:28px;
}

.service h3{
    margin-top:50px;
    font-size:16px;
}

.service p{
    margin-top:5px;
    color:#aaa;
    font-size:9px;
}

.chat{
    display:none;
    height:calc(100vh - 40px);
    flex-direction:column;
}

.chat.active{
    display:flex;
}

.chatHeader{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0 13px;
    border-bottom:1px solid #252538;
}

.back{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#151522;
    color:#fff;
    font-size:20px;
}

.chatAvatar{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    font-size:20px;
}

.chatTitle h3{
    font-size:14px;
}

.chatTitle p{
    color:#6e6e82;
    font-size:9px;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 2px;
}

.message{
    max-width:85%;
    padding:12px 14px;
    margin-bottom:12px;
    border-radius:16px;
    font-size:12px;
    line-height:1.5;
    word-wrap:break-word;
}

.bot{
    background:#151522;
    border:1px solid #242437;
    color:#ddd;
    border-top-left-radius:5px;
}

.user{
    margin-left:auto;
    background:linear-gradient(135deg,#7650df,#5552d7);
    border-top-right-radius:5px;
}

.typing{
    color:#888;
    font-style:italic;
}

.inputArea{
    display:flex;
    gap:8px;
    padding-top:8px;
}

.inputArea input{
    flex:1;
    height:50px;
    padding:0 15px;
    border-radius:15px;
    border:1px solid #272738;
    background:#11111d;
    color:#fff;
    outline:none;
}

.send{
    width:50px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:#fff;
    font-size:20px;
}

.backHome{
    margin-top:20px;
    width:100%;
    height:45px;
    border:0;
    border-radius:13px;
    background:#181825;
    color:#bbb;
}

@media(max-width:370px){
    .hero h2{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">
<div class="logo">✦</div>

<div>
<h1>Suhbat<span>AI</span></h1>
<p>Sizning aqlli suhbatdoshingiz</p>
</div>
</div>

</header>


<section id="home">

<div class="status">
● AI ONLINE
</div>

<div class="hero">

<h2>
Salom! 👋<br>
<span>Bugun nima haqida</span><br>
gaplashamiz?
</h2>

<p>
Suhbatlashing, savol bering, maslahat oling
yoki shunchaki suhbatlashing.
</p>

</div>


<div class="services">

<button class="service friend"
onclick="openChat('Do‘st','🧑‍🤝‍🧑')">

<div class="serviceIcon">🧑‍🤝‍🧑</div>

<h3>Do‘st</h3>
<p>Bemalol suhbatlashing</p>

</button>


<button class="service laugh"
onclick="openChat('Kulgu','😂')">

<div class="serviceIcon">😂</div>

<h3>Kulgu</h3>
<p>Hazil va qiziqarli suhbat</p>

</button>


<button class="service advice"
onclick="openChat('Maslahatchi','💡')">

<div class="serviceIcon">💡</div>

<h3>Maslahatchi</h3>
<p>Maslahat va yordam</p>

</button>


<button class="service question"
onclick="openChat('Savol-javob','❓')">

<div class="serviceIcon">❓</div>

<h3>Savol-javob</h3>
<p>Istalgan savolingizni bering</p>

</button>

</div>

</section>


<section id="chat" class="chat">

<div class="chatHeader">

<button class="back" onclick="goHome()">←</button>

<div class="chatAvatar" id="chatAvatar">
🤖
</div>

<div class="chatTitle">

<h3 id="chatName">Do‘st</h3>

<p>AI suhbatdosh • Online</p>

</div>

</div>


<div class="messages" id="messages"></div>


<div class="inputArea">

<input
id="input"
type="text"
placeholder="Xabar yozing..."
autocomplete="off"
>

<button class="send" onclick="sendMessage()">
➤
</button>

</div>

<button class="backHome" onclick="goHome()">
← Bosh sahifaga qaytish
</button>

</section>

</div>


<script>

const API_URL =
"https://suhbatai-backend-1.onrender.com/chat";

let currentChat = "Do‘st";


function openChat(name, emoji){

    currentChat = name;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("chat")
        .classList.add("active");

    document.getElementById("chatName")
        .textContent = name;

    document.getElementById("chatAvatar")
        .textContent = emoji;

    document.getElementById("messages")
        .innerHTML = "";

    addBot(
        "😊 Salom! Men SuhbatAI. " +
        "Menga istalgan savolingizni yozishingiz mumkin."
    );

    document.getElementById("input").focus();
}


function goHome(){

    document.getElementById("chat")
        .classList.remove("active");

    document.getElementById("home")
        .style.display = "block";
}


function addUser(text){

    const box =
        document.getElementById("messages");

    const msg =
        document.createElement("div");

    msg.className = "message user";

    msg.textContent = text;

    box.appendChild(msg);

    box.scrollTop = box.scrollHeight;
}


function addBot(text){

    const box =
        document.getElementById("messages");

    const msg =
        document.createElement("div");

    msg.className = "message bot";

    msg.textContent = text;

    box.appendChild(msg);

    box.scrollTop = box.scrollHeight;
}


function showTyping(){

    const box =
        document.getElementById("messages");

    const msg =
        document.createElement("div");

    msg.id = "typing";

    msg.className = "message bot typing";

    msg.textContent = "AI yozmoqda...";

    box.appendChild(msg);

    box.scrollTop = box.scrollHeight;
}


function removeTyping(){

    const typing =
        document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}


async function sendMessage(){

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if(!text){
        return;
    }


    addUser(text);

    input.value = "";

    showTyping();


    try{

        const response =
            await fetch(API_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    message:text
                })

            });


        const data =
            await response.json();


        removeTyping();


        if(!response.ok){

            addBot(
                "❌ AI server xatolik qaytardi."
            );

            console.error(data);

            return;
        }


        if(data.answer){

            addBot(data.answer);

        }else{

            addBot(
                "❌ AI javob qaytarmadi."
            );

        }


    }catch(error){

        removeTyping();

        console.error(error);

        addBot(
            "❌ Server bilan bog‘lanishda xatolik yuz berdi.\n\n" +
            "Internetni tekshiring yoki birozdan keyin qayta urinib ko‘ring."
        );

    }

}


document.getElementById("input")
.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
    </html>
